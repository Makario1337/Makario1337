<svg xmlns="http://www.w3.org/2000/svg" width="900" height="232" viewBox="0 0 900 232" role="img" aria-label="Currently: learning Kubernetes and working (ofc)">
  <style>
    text { font-family: SFMono-Regular, Consolas, "DejaVu Sans Mono", "Liberation Mono", Menlo, monospace; font-size: 17px; fill: #f8f8f2; white-space: pre; }
    .title { font-size: 13px; fill: #6272a4; }
    .prompt { fill: #50fa7b; }
    .head { fill: #6272a4; }
    .ok { fill: #50fa7b; }
    .bad { fill: #ff5555; }
    .row { opacity: 0; animation: show 0.25s ease-out forwards; }
    .r1 { animation-delay: 0.3s; }
    .r2 { animation-delay: 0.7s; }
    .r3 { animation-delay: 1.0s; }
    .r4 { animation-delay: 1.3s; }
    .r5 { animation-delay: 1.6s; }
    .r6 { animation-delay: 1.9s; }
    .cursor { fill: #f8f8f2; animation: blink 1.1s steps(2, jump-none) infinite; }
    @keyframes show { to { opacity: 1; } }
    @keyframes blink { from { opacity: 1; } to { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) {
      .row { opacity: 1; animation: none; }
      .cursor { animation: none; }
    }
  </style>
  <rect width="900" height="232" rx="12" fill="#282a36"/>
  <circle cx="26" cy="22" r="6" fill="#ff5555"/>
  <circle cx="46" cy="22" r="6" fill="#f1fa8c"/>
  <circle cx="66" cy="22" r="6" fill="#50fa7b"/>
  <text class="title" x="450" y="27" text-anchor="middle">jonas@makario1337: ~</text>

  <g class="row r1"><text x="28" y="66"><tspan class="prompt">$</tspan> kubectl get pods -n currently</text></g>
  <g class="row r2 head">
    <text class="head" x="28" y="100">NAME</text>
    <text class="head" x="300" y="100">READY</text>
    <text class="head" x="400" y="100">STATUS</text>
    <text class="head" x="640" y="100">RESTARTS</text>
    <text class="head" x="780" y="100">AGE</text>
  </g>
  <g class="row r3">
    <text x="28" y="128">learning-kubernetes</text>
    <text x="300" y="128">1/1</text>
    <text class="ok" x="400" y="128">Running</text>
    <text x="640" y="128">42</text>
    <text x="780" y="128">∞</text>
  </g>
  <g class="row r4">
    <text x="28" y="156">working-ofc</text>
    <text x="300" y="156">1/1</text>
    <text class="ok" x="400" y="156">Running</text>
    <text x="640" y="156">0</text>
    <text x="780" y="156">∞</text>
  </g>
  <g class="row r5">
    <text x="28" y="184">sleep</text>
    <text x="300" y="184">0/1</text>
    <text class="bad" x="400" y="184">CrashLoopBackOff</text>
    <text x="640" y="184">1337</text>
    <text x="780" y="184">∞</text>
  </g>
  <g class="row r6">
    <text x="28" y="214"><tspan class="prompt">$</tspan></text>
    <rect class="cursor" x="46" y="200" width="10" height="18"/>
  </g>
</svg>
