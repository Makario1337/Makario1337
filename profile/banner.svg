<svg xmlns="http://www.w3.org/2000/svg" width="900" height="200" viewBox="0 0 900 200" role="img" aria-label="Hi, I'm Jonas. IT Systems Integration Specialist">
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#bd93f9"/>
      <stop offset="0.5" stop-color="#ff79c6"/>
      <stop offset="1" stop-color="#8be9fd"/>
    </linearGradient>
    <clipPath id="frame">
      <rect width="900" height="200" rx="12"/>
    </clipPath>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="900" height="200" fill="#282a36"/>
    <rect width="900" height="5" fill="url(#accent)"/>
    <circle cx="840" cy="40" r="130" fill="#bd93f9" opacity="0.08"/>
    <circle cx="730" cy="190" r="90" fill="#ff79c6" opacity="0.07"/>
  </g>
  <g font-family="Segoe UI, Ubuntu, Helvetica, Arial, sans-serif">
    <text x="56" y="92" font-size="46" font-weight="700" fill="#f8f8f2">Hi, I'm Jonas</text>
    <text x="56" y="130" font-size="20" fill="#8be9fd">IT Systems Integration Specialist</text>
    <text x="56" y="160" font-size="15" fill="#6272a4">Germany</text>
  </g>
</svg>
