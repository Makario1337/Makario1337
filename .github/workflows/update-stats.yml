name: Update profile stats

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/update-stats.yml
      - scripts/generate_streak.py

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      # STATS_TOKEN is an optional PAT that adds private contributions.
      TOKEN: ${{ secrets.STATS_TOKEN || secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v6

      - name: Generate stats card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&theme=dracula&include_all_commits=true&count_private=true&hide_border=true
          path: profile/stats.svg
          token: ${{ env.TOKEN }}
          fail_on_error: true

      - name: Generate top languages card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&langs_count=6&theme=dracula&hide_border=true
          path: profile/top-langs.svg
          token: ${{ env.TOKEN }}
          fail_on_error: true

      - name: Generate streak card
        run: python3 scripts/generate_streak.py profile/streak.svg
        env:
          GITHUB_TOKEN: ${{ env.TOKEN }}
          GITHUB_USER: ${{ github.repository_owner }}

      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git commit -m "Update profile stats" || exit 0
          git push
